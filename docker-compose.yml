version: '3.8'

services:
  paper-assistant:
    build: .
    container_name: paper-assistant
    expose:
      - "8000"
      - "8501"
    volumes:
      - paper_data:/app/data
      - paper_logs:/app/logs
      - certbot_www:/var/www/certbot:ro
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:stable-alpine
    container_name: paper-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/paper-assistant.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - ./nginx/options-ssl-nginx.conf:/etc/nginx/options-ssl-nginx.conf:ro
    depends_on:
      paper-assistant:
        condition: service_healthy
    restart: unless-stopped

  # Certbot 用于自动申请/续期 Let's Encrypt 证书
  # 首次运行: docker compose run --rm certbot certonly --webroot ...
  certbot:
    image: certbot/certbot:latest
    container_name: paper-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done'"
    restart: unless-stopped

volumes:
  paper_data:
    driver: local
  paper_logs:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local
