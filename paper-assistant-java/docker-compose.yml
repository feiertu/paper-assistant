# =============================================================================
# Paper Assistant — Java 后端一键启动
#
#   cd paper-assistant-java && docker compose up -d --build
#
# 启动内容：
#   - postgres        pgvector 扩展的 PostgreSQL 16（结构化数据 + 向量）
#   - paper-assistant Java Spring Boot 后端（8080）
#   - nginx           Vue SPA + API 反向代理（80）
#
# 前置条件：
#   - 前端产物已构建：cd frontend && npm run build（否则 Docker 构建失败）
#   - API Key 等敏感项通过 .env 或环境变量注入（见 .env.example）
#
# ⚠ 相对路径以本文件（paper-assistant-java/）为基准，故数据/前端/nginx 都指向
#   仓库根目录（../）。构建上下文为仓库根目录，见 build.context: ..
#
# ⚠ 迁移旧数据：先启动 postgres，再执行 scripts/migrate_data.py
#   DATABASE_URL=postgresql://paper:paper@localhost:5432/paper_assistant \
#     python scripts/migrate_data.py
#
# ⚠ 现有 nginx/paper-assistant.conf 仍把 /api/ 代理到 paper-assistant:8000
#   （旧 Python 端口）。Java 后端监听 8080，部署前需把 proxy_pass 改为
#   http://paper-assistant:8080。
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: paper-assistant-postgres
    environment:
      POSTGRES_DB: paper_assistant
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: paper
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper -d paper_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  paper-assistant:
    build:
      context: ..
      dockerfile: paper-assistant-java/Dockerfile
    container_name: paper-assistant-java
    environment:
      # DB（与 application.yml 的 SPRING_DATASOURCE_* 占位符对齐）
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/paper_assistant
      - SPRING_DATASOURCE_USERNAME=paper
      - SPRING_DATASOURCE_PASSWORD=paper
      - API_PORT=8080
      - PAPER_ASSISTANT_DATA_DIR=/app/data
      # 外部 API Key（从宿主机环境/.env 注入）
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      # 模型 / 检索配置
      - LLM_MODEL=${LLM_MODEL:-qwen-2.5-72b-instruct}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai,voyage}
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-http://localhost:5173}
      # 鉴权（默认关闭）
      - API_AUTH_ENABLED=${API_AUTH_ENABLED:-false}
      - API_AUTH_KEY=${API_AUTH_KEY:-}
    volumes:
      # 旧 Python 数据目录（users.json / raw / parsed / processed / chroma_db）
      - ../data:/app/data
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: paper-assistant-nginx
    volumes:
      - ../nginx/paper-assistant.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - paper-assistant
    restart: unless-stopped

volumes:
  pgdata:
