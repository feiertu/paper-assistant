# ──────────── HTTP → HTTPS + ACME ────────────

server {
    listen 80;
    server_name feiertu.xyz www.feiertu.xyz;

    # Let's Encrypt ACME webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ──────────── HTTPS ────────────

server {
    listen 443 ssl http2;
    server_name feiertu.xyz www.feiertu.xyz;

    ssl_certificate     /etc/letsencrypt/live/feiertu.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feiertu.xyz/privkey.pem;
    include             /etc/nginx/options-ssl-nginx.conf;

    client_max_body_size 100M;

    # ── Streamlit UI ──

    location /_stcore/stream {
        proxy_pass http://paper-assistant:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://paper-assistant:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # ── FastAPI SSE 流式端点（必须先于 /api/ 通用规则） ──

    location /api/rag/query/stream {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://paper-assistant:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        chunked_transfer_encoding off;
    }

    # ── FastAPI 通用 API ──

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://paper-assistant:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
